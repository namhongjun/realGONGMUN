<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRC 인재개발원 통합 스케줄러</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

  <!-- 네비게이션바 (메인 아닐 때 표시) -->
  <nav id="navbar" class="hidden bg-white shadow-sm px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <span class="text-xl font-bold text-blue-600">🏛️ KRC 스케줄러</span>
    </div>
    <div class="flex gap-3">
      <button onclick="switchView('main')" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-medium">🏠 홈으로</button>
      <button onclick="switchView('calendar')" class="px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg text-sm font-medium">📅 공유 캘린더</button>
      <button onclick="switchView('rooms')" class="px-3 py-1.5 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 rounded-lg text-sm font-medium">🏫 강의실 예약</button>
    </div>
  </nav>

  <!-- 1. 메인 화면 -->
  <div id="view-main" class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-4xl w-full text-center space-y-8">
      <div>
        <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight mb-2">
          🏛️ KRC 인재개발원 통합 스케줄러
        </h1>
        <p class="text-lg text-gray-600">부서 공문 일정 관리 및 강의실 예약 통합 시스템</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-6">
        <div onclick="switchView('calendar')" class="cursor-pointer group bg-white p-8 rounded-2xl shadow-md hover:shadow-xl transition border border-gray-100 flex flex-col items-center text-center">
          <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-3xl mb-4 group-hover:bg-blue-600 group-hover:text-white transition">📅</div>
          <h2 class="text-2xl font-bold text-gray-800 mb-2">공유 캘린더</h2>
          <p class="text-sm text-gray-500">부서별 공문 일정 확인, AI 자동 공문 분석 등록 및 수기 일정 관리</p>
        </div>

        <div onclick="switchView('rooms')" class="cursor-pointer group bg-white p-8 rounded-2xl shadow-md hover:shadow-xl transition border border-gray-100 flex flex-col items-center text-center">
          <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-3xl mb-4 group-hover:bg-emerald-600 group-hover:text-white transition">🏫</div>
          <h2 class="text-2xl font-bold text-gray-800 mb-2">강의실 예약</h2>
          <p class="text-sm text-gray-500">대강의실, 국제회의실, 호실별, 전산교육장 예약 현황 조회 및 간편 신청</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 공유 캘린더 화면 -->
  <div id="view-calendar" class="hidden max-w-7xl mx-auto p-6 space-y-6">
    <div class="bg-white p-5 rounded-xl shadow-sm flex flex-wrap justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">📅 공유 캘린더</h1>
        <p class="text-sm text-gray-500">AI 공문 본문 분석 및 일정 관리</p>
      </div>
      <div class="flex gap-2">
        <button onclick="alert('수기 등록 모달 연동 영역')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-sm font-medium shadow-sm">✏️ 수기 일정 등록</button>
        <button onclick="alert('AI 공문 등록 모달 연동 영역')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-sm font-medium shadow-sm">📄 공문 AI 등록</button>
      </div>
    </div>
    <div class="bg-white p-6 rounded-xl shadow-sm">
      <div id="calendar" class="max-w-6xl mx-auto"></div>
    </div>
  </div>

  <!-- 3. 강의실 예약 화면 -->
  <div id="view-rooms" class="hidden max-w-6xl mx-auto p-6 space-y-6">
    <div class="bg-white p-5 rounded-xl shadow-sm flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">🏫 강의실 예약 및 현황</h1>
        <p class="text-sm text-gray-500">교육 과정별 강의실 사용 현황을 확인하고 예약하세요.</p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-xl shadow-sm space-y-4">
        <h2 class="text-lg font-bold text-gray-800 border-b pb-2">✏️ 강의실 예약 신청</h2>
        <form onsubmit="handleRoomReserve(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">강의실 선택</label>
            <select id="roomType" class="w-full border p-2 rounded-md text-sm bg-gray-50">
              <option value="대강의실">대강의실</option>
              <option value="국제회의실">국제회의실</option>
              <option value="101호">101호</option><option value="102호">102호</option><option value="103호">103호</option>
              <option value="104호">104호</option><option value="105호">105호</option><option value="106호">106호</option>
              <option value="201호">201호</option><option value="202호">202호</option><option value="203호">203호</option>
              <option value="전산교육장">전산교육장</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">교육 과정명</label>
            <input type="text" id="roomTitle" required placeholder="예: 드론실무활용(심화) 교육" class="w-full border p-2 rounded-md text-sm bg-gray-50">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">사용 일자</label>
            <input type="date" id="roomDate" required class="w-full border p-2 rounded-md text-sm bg-gray-50">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">담당자 성명</label>
            <input type="text" id="roomManager" required placeholder="예: 남홍준" class="w-full border p-2 rounded-md text-sm bg-gray-50">
          </div>
          <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-md text-sm font-medium shadow-md">예약 등록하기</button>
        </form>
      </div>

      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm space-y-4">
        <h2 class="text-lg font-bold text-gray-800 border-b pb-2">📋 강의실별 예약 현황</h2>
        <div id="roomList" class="space-y-2 mt-4">
          <p class="text-sm text-gray-400 py-6 text-center">등록된 예약 내역이 없습니다.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let calendar;

    function switchView(viewName) {
      document.getElementById('view-main').classList.add('hidden');
      document.getElementById('view-calendar').classList.add('hidden');
      document.getElementById('view-rooms').classList.add('hidden');
      document.getElementById('navbar').classList.add('hidden');

      if (viewName === 'main') {
        document.getElementById('view-main').classList.remove('hidden');
      } else if (viewName === 'calendar') {
        document.getElementById('view-calendar').classList.remove('hidden');
        document.getElementById('navbar').classList.remove('hidden');
        if (!calendar) {
          setTimeout(() => {
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
              initialView: 'dayGridMonth',
              locale: 'ko',
              headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' }
            });
            calendar.render();
          }, 100);
        }
      } else if (viewName === 'rooms') {
        document.getElementById('view-rooms').classList.remove('hidden');
        document.getElementById('navbar').classList.remove('hidden');
      }
    }

    function handleRoomReserve(e) {
      e.preventDefault();
      const room = document.getElementById('roomType').value;
      const title = document.getElementById('roomTitle').value;
      const date = document.getElementById('roomDate').value;
      const manager = document.getElementById('roomManager').value;

      const listEl = document.getElementById('roomList');
      if (listEl.innerHTML.includes('등록된 예약 내역이 없습니다')) listEl.innerHTML = '';

      listEl.innerHTML += `
        <div class="p-3 border rounded-lg flex justify-between items-center bg-gray-50 text-sm">
          <div>
            <span class="font-semibold text-gray-800">[${room}] ${title}</span>
            <span class="text-xs text-gray-500 block">📅 ${date} | 👤 담당자: ${manager}</span>
          </div>
        </div>`;
      alert("강의실 예약이 완료되었습니다!");
      e.target.reset();
    }
  </script>
</body>
</html>
