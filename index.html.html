<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KRC 인재개발원 모바일</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FullCalendar 모바일 지원 라이브러리 추가 -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <style>
    /* 모바일 캘린더 크기 최적화 */
    .fc { font-size: 11px; }
    .fc-toolbar-title { font-size: 14px !important; font-weight: bold; }
    .fc-button { padding: 4px 8px !important; font-size: 11px !important; }
    .fc-daygrid-day-number { padding: 4px !important; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20 select-none">

  <!-- 상단 앱 헤더 -->
  <header class="bg-blue-600 text-white px-5 py-4 sticky top-0 z-45 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold">🏛️ KRC 인재개발원</h1>
      <p class="text-xs text-blue-100">부서 통합 모바일 스케줄러</p>
    </div>
    <span class="text-xs bg-blue-500 px-2.5 py-1 rounded-full font-semibold">모바일 전용</span>
  </header>

  <!-- 메인 컨텐츠 영역 -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- 1. 일정 확인 탭 (모바일 캘린더 + 리스트) -->
    <section id="tab-schedules" class="space-y-3">
      <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
        <h2 class="font-bold text-gray-800 text-sm border-b pb-2">📅 부서 공유 캘린더</h2>
        <div id="calendar" class="w-full"></div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm space-y-2">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-gray-800 text-sm">📋 등록된 일정 목록</h2>
          <span id="scheduleCount" class="text-xs bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full font-semibold">0건</span>
        </div>
        <div id="scheduleList" class="space-y-2"></div>
      </div>
    </section>

    <!-- 2. 강의실 예약 탭 -->
    <section id="tab-rooms" class="hidden space-y-3">
      <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
        <h2 class="font-bold text-gray-800 text-sm border-b pb-2">🏫 강의실 간편 예약</h2>
        <form onsubmit="handleRoomReserve(event)" class="space-y-2.5">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">강의실 선택 (중복 가능)</label>
            <div class="grid grid-cols-3 gap-1.5 text-xs">
              <label class="border p-2 rounded text-center bg-gray-50 flex items-center justify-center gap-1"><input type="checkbox" name="rooms" value="대강의실"> 대강의실</label>
              <label class="border p-2 rounded text-center bg-gray-50 flex items-center justify-center gap-1"><input type="checkbox" name="rooms" value="국제회의실"> 국제회의실</label>
              <label class="border p-2 rounded text-center bg-gray-50 flex items-center justify-center gap-1"><input type="checkbox" name="rooms" value="101호"> 101호</label>
              <label class="border p-2 rounded text-center bg-gray-50 flex items-center justify-center gap-1"><input type="checkbox" name="rooms" value="102호"> 102호</label>
              <label class="border p-2 rounded text-center bg-gray-50 flex items-center justify-center gap-1"><input type="checkbox" name="rooms" value="103호"> 103호</label>
              <label class="border p-2 rounded text-center bg-gray-50 flex items-center justify-center gap-1"><input type="checkbox" name="rooms" value="전산교육장"> 전산교육장</label>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">교육 과정명</label>
            <input type="text" id="roomTitle" required placeholder="예: 드론실무활용 교육" class="w-full border p-2 rounded-lg text-sm bg-gray-50">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">시작일</label>
              <input type="date" id="roomStartDate" required class="w-full border p-2 rounded-lg text-xs bg-gray-50">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">종료일</label>
              <input type="date" id="roomEndDate" required class="w-full border p-2 rounded-lg text-xs bg-gray-50">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">담당자 성명</label>
            <input type="text" id="roomManager" required placeholder="예: 남홍준" class="w-full border p-2 rounded-lg text-sm bg-gray-50">
          </div>
          <button type="submit" class="w-full py-2.5 bg-emerald-600 text-white rounded-lg text-sm font-semibold shadow">예약 신청하기</button>
        </form>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm space-y-2">
        <h2 class="font-bold text-gray-800 text-sm border-b pb-2">📋 예약 현황 리스트</h2>
        <div id="roomList" class="space-y-2"></div>
      </div>
    </section>

    <!-- 3. 재실 현황 탭 -->
    <section id="tab-status" class="hidden space-y-3">
      <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="font-bold text-gray-800 text-sm">🚦 주요 관리자 재실 현황</h2>
          <button onclick="openManagerModal()" class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded-md font-semibold hover:bg-blue-100">+ 상태 관리</button>
        </div>
        <div id="managerStatusList" class="space-y-2.5"></div>
      </div>
    </section>

  </main>

  <!-- 관리자 상태 변경 모달 -->
  <div id="managerModal" class="hidden fixed inset-0 z-50 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-sm w-full p-5 space-y-4 shadow-2xl relative">
      <h3 class="text-md font-bold text-gray-800 border-b pb-2">🚦 관리자 재실 상태 편집</h3>
      <div class="space-y-2.5 max-h-60 overflow-y-auto" id="managerEditList"></div>
      <div class="border-t pt-3 flex gap-2">
        <input type="text" id="newManagerName" placeholder="새 관리자 이름" class="border p-1.5 rounded text-xs flex-grow bg-gray-50">
        <button onclick="addNewManager()" class="px-3 py-1.5 bg-blue-600 text-white rounded text-xs font-semibold">추가</button>
      </div>
      <div class="flex justify-end pt-2">
        <button onclick="closeManagerModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded text-xs font-semibold">닫기</button>
      </div>
    </div>
  </div>

  <!-- 하단 고정 모바일 내비게이션 바 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t py-2 px-6 flex justify-around items-center z-40 shadow-lg max-w-md mx-auto">
    <button onclick="switchTab('schedules')" id="nav-schedules" class="flex flex-col items-center text-blue-600 font-bold">
      <span class="text-xl">📅</span>
      <span class="text-[11px] mt-0.5">일정확인</span>
    </button>
    <button onclick="switchTab('rooms')" id="nav-rooms" class="flex flex-col items-center text-gray-400">
      <span class="text-xl">🏫</span>
      <span class="text-[11px] font-medium mt-0.5">강의실예약</span>
    </button>
    <button onclick="switchTab('status')" id="nav-status" class="flex flex-col items-center text-gray-400">
      <span class="text-xl">🚦</span>
      <span class="text-[11px] font-medium mt-0.5">재실현황</span>
    </button>
  </nav>

  <script>
    let calendar;

    let sharedEvents = JSON.parse(localStorage.getItem('krc_sharedEvents')) || [
      { id: '1', manager: '남홍준', title: '공무국외여행 심고자료 제출', start: '2026-09-07', end: '2026-09-23', description: '제출마감: 2026-09-22' },
      { id: '2', manager: '황이날', title: '농식품인재개발원 10월 추가교육 신청', start: '2026-09-07', end: '2026-09-11', description: '수요조사 신청 건' }
    ];

    let roomEvents = JSON.parse(localStorage.getItem('krc_roomEvents')) || [
      { id: 'r1', rooms: ['101호'], manager: '남홍준', title: '드론실무활용(심화) 교육', start: '2026-09-16', end: '2026-09-19' }
    ];

    let managersStatus = JSON.parse(localStorage.getItem('krc_managersStatus')) || [
      { name: '인재개발원장', status: '재실' },
      { name: '인재육성부장', status: '출장' },
      { name: '교육기획부장', status: '재실' },
      { name: '국제교육교류센터장', status: '휴가' }
    ];

    function saveData() {
      localStorage.setItem('krc_sharedEvents', JSON.stringify(sharedEvents));
      localStorage.setItem('krc_roomEvents', JSON.stringify(roomEvents));
      localStorage.setItem('krc_managersStatus', JSON.stringify(managersStatus));
    }

    function switchTab(tabName) {
      document.getElementById('tab-schedules').classList.add('hidden');
      document.getElementById('tab-rooms').classList.add('hidden');
      document.getElementById('tab-status').classList.add('hidden');

      document.getElementById('nav-schedules').className = 'flex flex-col items-center text-gray-400';
      document.getElementById('nav-rooms').className = 'flex flex-col items-center text-gray-400';
      document.getElementById('nav-status').className = 'flex flex-col items-center text-gray-400';

      document.getElementById('tab-' + tabName).classList.remove('hidden');
      document.getElementById('nav-' + tabName).className = 'flex flex-col items-center text-blue-600 font-bold';

      if (tabName === 'schedules') {
        renderSchedules();
        if (!calendar) {
          setTimeout(() => {
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
              initialView: 'dayGridMonth',
              locale: 'ko',
              headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
              events: sharedEvents,
              height: 320
            });
            calendar.render();
          }, 50);
        } else {
          calendar.updateSize();
        }
      }
      if (tabName === 'rooms') renderRooms();
      if (tabName === 'status') renderManagerStatus();
    }

    function renderSchedules() {
      const container = document.getElementById('scheduleList');
      document.getElementById('scheduleCount').innerText = sharedEvents.length + '건';
      
      if (sharedEvents.length === 0) {
        container.innerHTML = '<div class="text-center py-4 text-gray-400 text-xs">등록된 일정이 없습니다.</div>';
        return;
      }

      container.innerHTML = sharedEvents.map(ev => `
        <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 space-y-1">
          <div class="flex justify-between items-start">
            <span class="text-[11px] font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">${ev.manager}</span>
            <span class="text-[10px] text-gray-400">${ev.start} ~ ${ev.end}</span>
          </div>
          <div class="font-bold text-gray-800 text-xs">${ev.title}</div>
          ${ev.description ? `<p class="text-[11px] text-gray-500">${ev.description}</p>` : ''}
        </div>
      `).join('');
    }

    function renderRooms() {
      const container = document.getElementById('roomList');
      if (roomEvents.length === 0) {
        container.innerHTML = '<div class="text-center py-4 text-gray-400 text-xs">예약된 강의실이 없습니다.</div>';
        return;
      }

      container.innerHTML = roomEvents.map(ev => `
        <div class="bg-gray-50 p-3 rounded-lg border text-xs space-y-1">
          <div class="flex justify-between font-bold text-gray-700">
            <span>🏫 ${ev.rooms.join(', ')}</span>
            <span class="text-blue-600">${ev.manager}</span>
          </div>
          <div class="font-semibold text-gray-800">${ev.title}</div>
          <div class="text-[10px] text-gray-400">${ev.start} ~ ${ev.end}</div>
        </div>
      `).join('');
    }

    function renderManagerStatus() {
      const container = document.getElementById('managerStatusList');
      container.innerHTML = managersStatus.map(m => {
        let badgeColor = 'bg-green-500';
        if (m.status === '출장') badgeColor = 'bg-yellow-500';
        if (m.status === '휴가') badgeColor = 'bg-red-500';
        return `
          <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl border text-xs">
            <span class="font-semibold text-gray-700">${m.name}</span>
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full ${badgeColor}"></span>
              <span class="font-bold text-gray-600">${m.status}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function openManagerModal() {
      const listEl = document.getElementById('managerEditList');
      listEl.innerHTML = managersStatus.map((m, idx) => `
        <div class="flex items-center justify-between gap-2 border-b pb-2 text-xs">
          <span class="font-semibold w-24 text-gray-700">${m.name}</span>
          <select onchange="updateManagerStatus(${idx}, this.value)" class="border p-1 rounded text-xs bg-white">
            <option value="재실" ${m.status==='재실'?'selected':''}>🟢 재실</option>
            <option value="출장" ${m.status==='출장'?'selected':''}>🟡 출장</option>
            <option value="휴가" ${m.status==='휴가'?'selected':''}>🔴 휴가</option>
          </select>
          <button onclick="removeManager(${idx})" class="text-red-500 text-xs px-1.5 font-bold">삭제</button>
        </div>
      `).join('');
      document.getElementById('managerModal').classList.remove('hidden');
    }

    function closeManagerModal() {
      document.getElementById('managerModal').classList.add('hidden');
      renderManagerStatus();
    }

    function updateManagerStatus(idx, status) {
      managersStatus[idx].status = status;
      saveData();
    }

    function addNewManager() {
      const name = document.getElementById('newManagerName').value.trim();
      if (!name) return;
      managersStatus.push({ name: name, status: '재실' });
      document.getElementById('newManagerName').value = '';
      saveData();
      openManagerModal();
    }

    function removeManager(idx) {
      managersStatus.splice(idx, 1);
      saveData();
      openManagerModal();
    }

    function handleRoomReserve(e) {
      e.preventDefault();
      const checkedRooms = Array.from(document.querySelectorAll('input[name="rooms"]:checked')).map(el => el.value);
      if (checkedRooms.length === 0) {
        alert("최소 1개 이상의 강의실을 선택해주세요.");
        return;
      }

      const title = document.getElementById('roomTitle').value;
      const start = document.getElementById('roomStartDate').value;
      const end = document.getElementById('roomEndDate').value;
      const manager = document.getElementById('roomManager').value;

      roomEvents.push({
        id: String(Date.now()),
        rooms: checkedRooms,
        manager: manager,
        title: title,
        start: start,
        end: end
      });

      saveData();
      renderRooms();
      alert("강의실 예약이 완료되었습니다!");
      e.target.reset();
    }

    // 최초 로딩 시 실행
    switchTab('schedules');
  </script>
</body>
</html>
